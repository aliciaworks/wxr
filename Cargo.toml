# An XR core.
#
# The workspace, and why it is shaped this way, is in the README. What matters here is the one dependency
# every crate shares: the math, because a pose is a position and an orientation and both sides of every
# boundary have to agree on what those are.
[workspace]
resolver = "3"
members = ["crates/wxr", "crates/wxr-openxr", "crates/wxr-webxr", "crates/wxr-render", "crates/wxr-apple"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# A pose is not a bevy transform or an OpenXR `XrPosef`; it is a position and an orientation, and the crates
# that carry one across a boundary should not have to convert between three spellings of that.
glam = "0.30"
# The renderer's layer, and the reason the core does not need one: a backend is *given* a device, and what
# it is given is a wgpu device.
#
# 30 and not 27, which is what bevy is on: `wgpu-hal`'s Vulkan backend grew
# `Device::texture_from_raw` in 30, and without it there is no way to wrap a compositor's image as a wgpu
# texture - which is the whole of what an OpenXR backend has to do with one. Matching bevy's version would
# buy an interop that is not wanted and cost the only path to the headset.
wgpu = "30"
thiserror = "2"
log = "0.4"

[profile.dev]
opt-level = 1
