# An XR core.
#
# The workspace, and why it is shaped this way, is in the README. What matters here is the one dependency
# every crate shares: the math, because a pose is a position and an orientation and both sides of every
# boundary have to agree on what those are.
[workspace]
resolver = "3"
members = [
    "crates/wxr",
    "crates/wxr-openxr",
    "crates/wxr-webxr",
    "crates/wxr-webxr-smoke",
    "crates/wxr-render",
    "crates/wxr-apple",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# A pose is not a bevy transform or an OpenXR `XrPosef`; it is a position and an orientation, and the crates
# that carry one across a boundary should not have to convert between three spellings of that.
glam = "0.30"
# The renderer's layer, and the reason the core does not need one: a backend is *given* a device, and what
# it is given is a wgpu device.
#
# 30, because `wgpu-hal`'s backends grew `texture_from_raw` in it - Vulkan's `Device::texture_from_raw`, and
# Metal's - and without it there is no way to wrap a compositor's image as a wgpu texture, which is the whole
# of what an OpenXR or an Apple backend has to do with one.
#
# From a fork, and pinned to the commit rather than the branch: this is the one thing the WebXR backend needs
# that upstream does not have - `RequestAdapterOptions::xr_compatible`, without which a wgpu device cannot be
# an XR-compatible one and `XRGPUBinding` refuses it. Upstream's #9350 proposed it and was closed without
# landing it, so the fork (branch `xr-compatible-adapter`) carries it. When a release grows the field, this
# becomes `wgpu = "31"` or whatever that release is, and the fork has nothing left to carry.
wgpu = { git = "https://github.com/yukarikaname/wgpu", rev = "8939f7ef5842aed37de461cfc9b7806829cbb8b6" }
thiserror = "2"
log = "0.4"

[profile.dev]
opt-level = 1
