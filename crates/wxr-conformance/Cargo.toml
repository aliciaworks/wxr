[package]
name = "wxr-conformance"
description = "What wxr's WebXR vocabulary means, checked against another implementation of the same API."
version.workspace = true
edition.workspace = true

# This crate has no library to speak of; it exists so that the tests have somewhere to live that can name
# both implementations. `wxr` is the one under test and `servo-webxr` is the reference: a second, independent
# implementation of the WebXR API in Rust, which is what makes a differential test possible at all - two
# readings of one specification, compared.
[dev-dependencies]
# The reference. MPL-2.0, and it stays a dependency rather than a copy: what is being compared is its reading
# of the specification, and a copy of it would be our reading of its reading.
servo-webxr-api = "0.7"

# The one under test.
wxr = { path = "../wxr" }
