[package]
name = "wxr-webxr"
description = "A WebXR backend for wxr, for the browser."
version.workspace = true
edition.workspace = true

# Everything is under the target, because on anything but wasm this crate is empty: there is no WebXR
# outside a browser, and a desktop build should not have to build a browser to know that.
[target.'cfg(target_family = "wasm")'.dependencies]
wxr = { path = "../wxr" }
# The importer's trait and the one colour-format mapping, so that this backend cannot disagree with the
# other two about what a texture is.
wxr-render = { path = "../wxr-render" }
thiserror = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "XrSystem",
    "XrSession",
    "XrSessionInit",
    "XrSessionMode",
    "XrVisibilityState",
    "XrFrame",
    "XrViewerPose",
    "XrView",
    "XrEye",
    "XrViewport",
    "XrReferenceSpace",
    "XrReferenceSpaceType",
    # The render state, so that presenting a *layer* comes from the bindings rather than from a hand-built
    # object: `XrRenderStateInit::set_layers` is what a WebGPU-compatible session presents through.
    "XrLayer",
    "XrRenderStateInit",
    "XrRigidTransform",
    "XrPose",
    "XrSpace",
    "XrInputSource",
    "XrInputSourceArray",
    "XrHandedness",
    "Gamepad",
    "GamepadButton",
    # `XrRigidTransform` reports its position and orientation as DOM points.
    "DomPoint",
    "DomPointReadOnly",
    "Event",
] }
