# The verification this workspace can do without a headset, which is what the README lists.
#
# Four of the jobs are the ones worth explaining, and they are one argument four times: each backend crate is
# empty outside its own target family, so the only way a backend is built at all is by building it for a
# platform this runner is not. Three of the four are `clippy`-level - no linking, no SDK, and nothing that
# runs - which is why they share the host job's machine rather than getting a runner apiece: `wasm` is the
# WebXR backend, `apple` is the visionOS one, and `cross` is Android. `native` is the exception, and it is
# one because it does not have to be: arm64 Linux and arm64 Windows have runners of their own and a public
# repository gets them free, so those jobs run the tests rather than type-checking them.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The registry and the git checkouts, not `target/` - the same choice revp-rust's CI makes, and it
      # matters more here: this workspace's wgpu comes from a git fork, so without this every run clones and
      # rebuilds wgpu. The key is the lock, which is the resolved graph the cache actually holds.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-host-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-host-cargo-

      # `wxr-conformance` compares this core's vocabulary with `servo-webxr-api`, and that crate reaches
      # Servo's font stack: `freetype-sys` is the one dev-dependency in this workspace that is not pure Rust,
      # and a runner with no headers for it stops the clippy step rather than failing a test. The three here
      # are what that stack asks for by name; `pkg-config` is how it asks.
      - name: The system libraries the vocabulary suite's dependency reads
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfreetype-dev libfontconfig-dev libharfbuzz-dev pkg-config

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `wxr-webxr`'s `sys/` is generated, and a generator that cannot resolve a declaration leaves it out
      # with no error at all - which cost `XRRigidTransform` its constructor arguments and `XRDOMOverlayInit`
      # its whole file before it was ever run by anything. This compares the output with the input, member by
      # member, and the prototype snapshot beside the IDL with what a real browser exposes. Offline, stdlib
      # only, and until now listed as a check that no machine was making.
      - name: The generated WebXR bindings
        run: python3 Tools/check_webxr_sys.py

      # The README's shell blocks name crates, examples and scripts by path, and a name that stopped
      # existing when a file moved survives a green build - `gates.sh` runs those commands, but a command
      # run here is not a command a reader can run there. Existence only, offline, and instant.
      - name: The paths the README names
        run: python3 Tools/check_readme_paths.py

      # `wxr-apple` is only *compiled* in the visionos job, and that job has no Apple to link or run
      # against either - so a wrong `extern "C"` signature would reach a device unnoticed. What any machine
      # can do is compare each declaration against Apple's own prototype, out of an SDK mirror, WebKit's
      # soft-link headers and mirrors of the documentation. It skips itself when the network is not there.
      - name: The Apple declarations
        run: python3 Tools/check_apple_sys.py

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # The registry and the git checkouts, not `target/` - the same choice revp-rust's CI makes, and it
      # matters more here: this workspace's wgpu comes from a git fork, so without this every run clones and
      # rebuilds wgpu. The key is the lock, which is the resolved graph the cache actually holds.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      # The whole workspace, because a host-only crate is empty here and a wasm-only one is not.
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings

  # The other half of the same argument, for the targets that were never in it - and done the stronger way,
  # because a public repository gets arm64 runners free. `wxr-openxr`'s dependency gate is
  # `all(not(wasm), not(target_vendor = "apple"))`, which is a claim about Windows and every Linux, and
  # nothing had ever compiled it for either. Both arm64 targets are Tier 1 *with host tools* - `rustup` and
  # `cargo` run on those machines themselves - so this is not a cross-compile and there is no reason to
  # type-check what can be executed.
  #
  # `x86_64-pc-windows-msvc` is in the matrix because it is the Windows that actually has XR runtimes on it,
  # and checking the rare arm of a platform while leaving the common one out would be a strange thing to do.
  #
  # Three crates and not `--workspace`, which is the shape the visionOS job has and for a reason of the same
  # kind: these are the ones that are not empty here. `wxr-conformance` is the one that is, and it is not a
  # near miss - it pulls `servo-webxr-api`, whose font stack compiles C, and comparing this workspace's
  # vocabulary with Servo's is not a question about Windows. It also means the tests below cannot be held up
  # by a C toolchain that has nothing to do with what is being tested.
  #
  # Most of what runs skips: a runner has no GPU for `wxr-render` and no XR runtime for `wxr-openxr`, and
  # both say so rather than failing, which is the same contract they have on the host. What does run is the
  # core's own arithmetic, on architectures that had never executed a line of it.
  native:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # Thirty minutes is generous for three crates and a test run, and it is here because this workspace has
    # already produced one test that hangs rather than fails - see `wxr-render`'s test lock - and a hang on a
    # runner is six hours of nothing without a bound on it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The key names the architecture as well as the OS, because this matrix has two Windows in it and the
      # two do not share a build output - but they do share the registry and the git checkouts, which is all
      # this caches, so the two restore the same archive and clone wgpu once between them.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-cargo-
      - run: cargo clippy -p wxr -p wxr-render -p wxr-openxr --all-targets -- -D warnings
      # `--nocapture`, which is not the default anywhere else in this file, because a test that skips itself
      # is a test that passed and the two are indistinguishable in a summary line. Both suites that can skip
      # say so on stderr and `libtest` throws the stderr of a *passing* test away, so without this the answer
      # to "did anything actually run on this platform" is not in the log at all - which is the one question
      # these three jobs exist to answer.
      - run: cargo test -p wxr -p wxr-render -p wxr-openxr -- --nocapture

  # And the one target in the same gate that has no runner at all, which is also the one a standalone headset
  # actually runs. Android cannot be executed from here even in principle: the loader wants a `JavaVM` and an
  # `Activity` before `xrCreateInstance`, which is why `wxr-openxr`'s own comment says `()` is the answer
  # "everywhere but Android". So this one is compile-level, and it earns the runner by being the target
  # nothing else in this file would notice rotting.
  cross:
    name: aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cross-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-cargo-
      - run: cargo clippy -p wxr -p wxr-render -p wxr-openxr --all-targets --target aarch64-linux-android -- -D warnings

  apple:
    name: visionos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-visionos
          components: clippy
      # The registry and the git checkouts, not `target/` - the same choice revp-rust's CI makes, and it
      # matters more here: this workspace's wgpu comes from a git fork, so without this every run clones and
      # rebuilds wgpu. The key is the lock, which is the resolved graph the cache actually holds.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-visionos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-visionos-cargo-

      # `wxr-apple` alone: it is empty off Apple, and the OpenXR backend is not - it would be built for a
      # platform it has no reason to be on.
      - run: cargo clippy -p wxr-apple --target aarch64-apple-visionos --all-targets -- -D warnings
      - run: cargo doc -p wxr-apple --target aarch64-apple-visionos --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The job above only *type-checks* `wxr-apple`: it cannot tell a declaration of something that exists
  # from a declaration of something that does not, because nothing links. This one links and then runs what
  # it linked, on the machine that has Apple's SDK - and it is not hypothetical, since it is what found that
  # `ar_hand_anchor_get_origin_from_anchor_transform_with_correction` is in Apple's documentation and in no
  # SDK at all.
  linked:
    name: visionos (linked)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-visionos

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-linked-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linked-cargo-

      # `xcrun` is the whole of it on a machine that has Xcode: which visionOS SDK is there is Xcode's
      # answer, and `SDKROOT` is how a build for that platform is told to use it. Nothing here needs to
      # know a version.
      - name: The visionOS SDK
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk xros --show-sdk-path)"
          echo "visionOS $(xcrun --sdk xros --show-sdk-version) at ${sdk}"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"

      - name: Link it
        run: cargo build -p wxr-apple --target aarch64-apple-visionos

      # The tests are this machine's, and they are the first thing in the README's list that `wxr-apple`
      # has: the crate is `target_vendor = "apple"` and a Mac is one, so its own tables - the joint table
      # ARKit's names are read through, the pixel formats, the id ranges, the shim's layouts - link and run
      # here rather than only compiling. `SDKROOT` is pointed back at macOS because the step above set it to
      # the visionOS SDK and a build for this machine wants its own; nothing else differs from the README.
      - name: Test it
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo test -p wxr-apple

  # `wxr`'s `rust-version` says 1.85, and a field nobody builds against is a number rather than a claim -
  # which is the distinction the rest of this file is about, so it is checked the same way. This is the job
  # that makes the field honest: it installs exactly that rustc and asks whether the crate still builds.
  #
  # It is `wxr` alone, and that is the point rather than a limit on ambition. The other crates do not carry
  # a `rust-version` at all - `wxr-render` and `wxr-openxr` take `wgpu` from a pinned git revision, whose own
  # `ordered-float` wants 1.90 today, so their floor is `wgpu`'s to move and a number here would be out of
  # date before the next dependency bump; `wxr-webxr` measures 1.85 but only where it is an empty crate,
  # since everything it has lives under `cfg(target_family = "wasm")` and there it takes `wgpu` too. One
  # crate with a version that is checked is worth more than four with versions that are not.
  #
  # `--locked`, because the claim is about the graph in the lock and not whichever versions resolve today.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-cargo-
      - name: Build wxr with the version it claims
        run: cargo check -p wxr --locked
